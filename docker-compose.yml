services:
  database:
    image: postgres
    container_name: gourmand-database
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - gourmand-network

  migration:
    build:
      context: .
      target: migration
    env_file:
      - .env
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - gourmand-network

  app:
    container_name: gourmand-app
    build:
      context: .
      target: runner
    env_file:
      - .env
    working_dir: /app
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - gourmand_data:${NUXT_IPX_FS_DIR}
    networks:
      - gourmand-network

  adminer:
    image: adminer
    container_name: gourmand-adminer
    restart: unless-stopped
    networks:
      - gourmand-network

volumes:
  gourmand_data:

networks:
  gourmand-network:
    driver: bridge
