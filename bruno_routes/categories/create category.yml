info:
  name: create category
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/categories
  headers:
    - name: Authorization
      value: Bearer {{NUXT_API_KEY}}
  body:
    type: json
    data: |-
      {
        "name": "Default"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
