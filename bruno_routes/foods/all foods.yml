info:
  name: all foods
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/foods?lastEaten=true
  headers:
    - name: Authorization
      value: Bearer {{NUXT_API_KEY}}
  params:
    - name: fullContent
      value: "true"
      type: query
      disabled: true
    - name: userId
      value: "1"
      type: query
      disabled: true
    - name: lastEaten
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
