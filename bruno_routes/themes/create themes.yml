info:
  name: create themes
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/themes
  headers:
    - name: Authorization
      value: Bearer {{NUXT_API_KEY}}
  body:
    type: json
    data: |-
      {
        "name": "Theme"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
