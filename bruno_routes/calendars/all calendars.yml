info:
  name: all calendars
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/calendars
  headers:
    - name: Authorization
      value: Bearer {{NUXT_API_KEY}}
  params:
    - name: fullContent
      value: "true"
      type: query
      disabled: true
    - name: userId
      value: "1"
      type: query
      disabled: true
    - name: date
      value: 2026-7-30
      type: query
      disabled: true
    - name: month
      value: 2026-7-1
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
